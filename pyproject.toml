[project]
name = "payment-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic[email]>=2,<3",
    "sqlalchemy>=2,<3",
    "psycopg[binary]>=3,<4",
    "python-dotenv>=1,<2",
    "alembic>=1.13,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx2>=2.6,<3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
